name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes the repository suite, which applies the real migrations to
      # an in-memory Postgres (PGlite): no database service needed.
      - name: Unit and API tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build never connects to anything; these satisfy nothing at
          # runtime and are intentionally not real credentials.
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Boots in-memory Postgres, a fake OpenAI API and the production
      # server (see e2e/server.mjs), then drives the app in a real browser.
      - name: Run end-to-end tests
        run: npm run e2e
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
